[package]
name = "setlistarray"
version = "0.1.0"
edition = "2024"

# Two targets from one crate. The desktop binary is `main.rs`; Android loads the
# `cdylib` and calls `android_main`. `rlib` is what the binary and the tests
# link against — everything but the entry points lives in `src/lib.rs`.
[lib]
name = "setlistarray"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Not re-exported by the rinch prelude, but ActionIcon's `icon` prop needs the type
# and the handoff calls for Tabler icons throughout.
rinch-tabler-icons = { path = "../rinch-fixes/crates/rinch-tabler-icons" }

# Offline webpage capture (src/capture/). One HTTP API over ureq natively and
# `fetch` on wasm, so the capture engine never names a transport — the plan's
# call, and the reason there is no direct `ureq` line in this file even though
# ureq is what runs underneath on both the platforms this app ships to.
rinch-http = { path = "../rinch-fixes/crates/rinch-http" }

# The HTML parser the capture sanitiser walks. html5ever is the parser Servo
# uses, so it is spec-correct on the malformed markup chord sites actually
# serve, it is pure Rust with no C toolchain, and it is already half-present in
# the tree — Stylo brings `string_cache`, `phf` and `precomputed-hash` with it.
# `markup5ever_rcdom` is the html5ever project's own minimal DOM, versioned in
# lockstep; its crates.io blurb calls it unsupported test scaffolding, which is
# a real risk and is written up in docs/CAPTURE.md along with the way out.
html5ever = "0.39"
markup5ever_rcdom = "0.39"

# Resolving a page's relative `<img src>` against the URL it came from, and
# deciding whether a stylesheet is same-host. Already in the tree via Rinch;
# named here because the capture module reaches for it directly.
url = "2"

# Reading a PDF far enough to count its pages (src/pdf/mod.rs). `hayro-syntax` is
# the parser half of `hayro`, the rasteriser docs/PDF.md chose on 2026-08-26
# and card D4 will draw pages with; taking the parser now means D4's `hayro`
# line arrives over a crate already in the tree at a version cargo has already
# unified, rather than over a second PDF library. docs/PDF.md measured the
# parser alone at +236,554 B of APK against hayro's whole +2,486,352 B, and D3
# needs a page count rather than a picture.
#
# Re-measured on 2026-08-28 by building the APK with this card's whole working
# tree stashed and again with it applied: 7,823,883 B -> 7,991,819 B, so the
# parser *and* everything else D3 adds together come to +167,936 B. Beware the
# 6,799,883 B figure docs/PDF.md calls "today": it was taken on 2026-08-26 and
# the APK at 98ae4eb is already 7,823,883 B without a line of PDF code in it,
# so a delta measured against that number reads a megabyte of other people's
# cards as this one's cost. Two builds an hour apart is the only honest way to
# price a dependency here.
#
# D4 turned the `images` feature back on, which is why `default-features` is no
# longer disabled here: JPEG2000, JBIG2 and CCITT are how a *scanned* chart —
# docs/PDF.md's `scanbook30.pdf`, the photocopied-Real-Book case — becomes
# pixels, and a rasteriser that silently drew those pages blank would be worse
# than one that refused them. The line is still spelled out rather than folded
# into `hayro` below, because this is the crate the *parser* comes from and
# `page_count` still calls it directly with no renderer in sight.
#
# Card K33 came back to ask whether the fax-era codecs could go — JBIG2 is
# 163,820 B of `.text` and JPEG2000 and CCITT are not free either — and the
# answer is no, twice over. `images` is one feature covering all four codecs
# with no per-codec granularity, and `hayro-interpret` depends on
# `hayro-syntax` with `features = ["std", "images", "unsafe"]` spelled out, so
# turning it off here changes nothing: cargo unifies it straight back on. It
# would take a feature split upstream, and it would take it in order to drop
# support for exactly the photocopied Real Book the paragraph above is about.
# Not worth doing, and worth writing down so the next reader does not go and
# measure it again.
hayro-syntax = "0.7.2"

# Drawing a page (src/pdf/pages.rs). The rasteriser half of the decision
# docs/PDF.md took on 2026-08-26, arriving now that D4 wants pixels rather than
# a count. It brings `hayro-interpret` (the content-stream interpreter),
# `vello_cpu` (the CPU rasteriser Rinch itself paints with, so this is a crate
# the tree already builds) and `pic-scale`, and it re-exports both `vello_cpu`
# and `hayro_syntax`, so nothing here has to name a version for either.
#
# Default features are deliberate: `embed-fonts` and `embed-cmaps` are what let
# a chart exported with the base-14 fonts *not embedded* — the common case for
# anything out of a text tool — render with real Helvetica and Courier instead
# of nothing. They are the largest part of this crate's footprint and the whole
# reason a chart looks like a chart. See the APK note below for what they cost.
#
# Measured on 2026-08-28 the way the D3 note above insists — two
# `./build-apk.sh` runs, one on the clean tree at 65d7b6e and one on this card,
# rather than against a number from a document: **7,991,819 B before,
# 10,416,651 B after, +2,424,832 B (+2.31 MiB)**.
#
# That is almost exactly what was predicted, which is worth saying because it
# means nothing unexpected came in with it: docs/PDF.md priced the whole of
# hayro at +2,486,352 B from a tree with no PDF code at all, D3 had already
# paid +167,936 B of that for the parser, and 2,486,352 - 167,936 = 2,318,416
# against the 2,424,832 measured. The 106 KB over is `png`'s encoder, the
# `pages` module itself, and a three-function fix in `../rinch-fixes` that this
# card needed and could not avoid building into the same APK.
hayro = "0.7.1"

# Encoding a rendered page as a 16-colour palette PNG (src/pdf/pages.rs).
#
# Not the `image` crate, which is the obvious reach and cannot do this: its PNG
# encoder writes L8/La8/Rgb8/Rgba8 and has no indexed output, so the smallest
# thing it can produce for a page of black ink on white paper is the Luma8 that
# docs/PDF.md measured at 104 KiB a page against a palette's 44 KiB. `png` is
# the crate `image` wraps anyway — it is already in this tree twice over, via
# `image` at 0.17 and via `vello_common` at 0.18 — so asking for 0.18 directly
# unifies onto a build that was happening regardless and adds no crate at all.
png = "0.18"

# The library itself: rhypedb, in-process. `default-features = false` keeps the
# fastembed/ONNX stack out — an embedding runtime is not something this app can
# ship on a phone, and nothing here needs vector search.
rhypedb-engine = { path = "../rhypedb-main/crates/rhypedb-engine", default-features = false }
rhypedb-schema = { path = "../rhypedb-main/crates/rhypedb-schema" }

# TEMPORARY, and the one place this project depends on a working tree.
#
# `local/both-fixes` in that checkout is main plus the two branches under review
# upstream — joeleaver/rinch#245 (paint) and #246 (viewport scale). Developing
# against them beats developing against the old d25f646 pin, which renders
# correctly but predates five months of the framework.
#
# When both PRs merge, card A1/A2: replace the path with
#   rinch = { git = "https://github.com/joeleaver/rinch.git", rev = "<merged>", … }
#   rinch-tabler-icons = { git = "https://github.com/joeleaver/rinch.git", rev = "<merged>" }
# and delete src/bin/probe.rs.
#
# `desktop` and `android` are mutually exclusive backends — one shell each — so
# the dependency is declared per target rather than in `[dependencies]`. Only
# one of these tables is ever active in a given build, so cargo's feature
# unification never sees both.
[target.'cfg(not(target_os = "android"))'.dependencies]
rinch = { path = "../rinch-fixes/crates/rinch", default-features = false, features = [
    "desktop",
    "components",
    "theme",
    # The `rfd` file dialog behind `rinch::dialogs` — the desktop half of the
    # picker seam in `src/picker.rs`. Android has no dialog to enable: its
    # picker is an activity, and it comes from `rinch-android` below.
    "file-dialogs",
] }

# Keeping the desktop's screensaver out of the way while a set is being played
# (`src/keep_awake.rs`, card F4). One `org.freedesktop.ScreenSaver.Inhibit` call
# over the session bus, and it is the cheapest line in this file: **zbus is
# already compiled into every desktop build of this app** — `rinch`'s
# `file-dialogs` feature brings `rfd`, whose Linux backend is `xdg-portal`,
# which is `ashpd`, which is `zbus` 5.19. Naming it here turns on zbus's own
# `blocking-api` feature and adds no crate at all: `cargo tree --edges normal`
# lists 457 packages with this line and the same 457 without it.
#
# It is under the desktop table rather than in `[dependencies]`, so the number
# this project actually guards — what the APK weighs — does not move by a byte.
# That is the whole reason the desktop half of F4 was worth building: on a phone
# this would have been a real dependency to argue about, and on the desktop it
# is a crate already in the tree being used for a second thing.
zbus = "5"

[target.'cfg(target_os = "android")'.dependencies]
rinch = { path = "../rinch-fixes/crates/rinch", default-features = false, features = [
    "android",
    "components",
    "theme",
] }
# Pulled in transitively by `rinch/android`, but named here too: the safe-area
# insets and the display density are read directly (src/platform.rs).
rinch-android = { path = "../rinch-fixes/crates/rinch-android" }
# `android_main` reports a failure to find app-private storage through the
# logger `rinch`'s Android shell installs; stderr goes nowhere on a phone.
log = "0.4"

[features]
# Rinch's debug IPC server: DOM dumps, computed styles, screenshots, synthetic
# input. It listens on a localhost port whenever it is compiled in, so it is
# off by default and switched on explicitly:
#   cargo run --release --features devtools
devtools = ["rinch/debug"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The release profile exists for one reason: what ships to the phone.
#
# Card K33 measured the installed app at 46.6 MB against an 11.5 MiB APK and
# went looking for the difference. There was no `[profile.release]` section
# here at all, so `libsetlistarray.so` went to the device with its symbol
# tables intact — `.symtab` 4,646,160 B and `.strtab` 5,497,880 B, 10.1 MB of
# names that nothing on Android ever reads. Android's loader resolves the
# library's exports from `.dynsym`, which `strip = "symbols"` leaves alone;
# `.symtab` is for a debugger, and there is no debugger on a gigging
# musician's phone.
#
# What it costs is a native backtrace. If one is ever wanted, the unstripped
# library is still sitting in `target/<triple>/release/` after the build —
# stripping happens on the way out of cargo, not in place — so keep that file
# next to the APK before the next `cargo clean` rather than turning this off.
#
# `panic = "abort"` is deliberately NOT here, however tempting `.eh_frame` and
# `.gcc_except_table` look at 2.7 MB together. `src/pdf/pages.rs` wraps hayro
# in `catch_unwind` precisely because a chart is a file that came from the
# internet, and aborting would turn a malformed PDF into a crashed app.
#
# Neither is `lto`, and that one is a near miss worth writing down. K33 also
# asked for `lto = "fat"` and `codegen-units = 1`, which are worth 3.29 MB on
# the phone — but here they would apply to the desktop build too, and an
# incremental rebuild after touching `src/lib.rs` goes 7.28s → 124.74s under
# them. `scripts/screenshot.sh` runs a release build every time the visual net
# is checked, so that is the loop that would pay. They live in `build-apk.sh`
# as `CARGO_PROFILE_RELEASE_*` instead, where only the phone build sees them,
# and `link_time_optimisation_is_asked_for_by_the_apk_build_alone` in
# src/lib.rs keeps them from wandering back.
[profile.release]
strip = "symbols"
