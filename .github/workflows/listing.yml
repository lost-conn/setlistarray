# Photograph SetListArray on a headless emulator, frame the pictures, and — only
# when asked — hand the finished store page to Google Play.
#
# Three jobs, in the order a person would do this by hand. `capture` boots a
# headless emulator and walks the app through `scripts/store-shots.sh`, leaving
# one raw frame per screen and the insets it measured off the panel. `compose`
# takes those onto a plain runner with no emulator, no Android SDK and no
# secret, and runs `scripts/store-frame.py`: the gradient fitted out of the
# launcher icon, the device plate, the captions from `store/shots.json`, and
# every shape rule Play has, checked. `publish` sends the words in
# `store/metadata/en-US/` and the pictures `compose` made, and it is the only
# one of the three that has ever heard of a credential.
#
# ## The default run publishes nothing
#
# `upload` is an input and it is false unless somebody sets it, so the ordinary
# run captures, composites, validates and attaches the pictures to the run for a
# person to look at — and sends nothing anywhere. That is the shape card S1
# chose and the reason is still the reason: a store page is read by strangers
# and reviewed by nobody, and the only moment anybody ever actually looks at
# these seven pictures is the moment between making them and publishing them.
# Deleting that moment would save one click.
#
# With `upload: true` the run captures and composites again from scratch rather
# than reaching back for the artifact of the run somebody approved. The argument
# is that the pipeline is deterministic — same commit, same seeded database, same
# pinned system image, same compositor, therefore the same bytes — so "the
# pictures that were looked at" and "the pictures that go to Play" are the same
# pictures either way, and a run that fetches its inputs from another run is a
# run whose inputs can be from another *commit*.
#
# That "therefore" is carrying real weight and nothing in this file enforces it.
# An emulator is not a pure function; a system image can be re-pulled under the
# same tag, a font can be rasterised a hair differently, and no byte-for-byte
# comparison is made anywhere here. The trade was made knowingly, because the
# two failures are not the same size: re-rendering risks a store page that is
# right about the app and differs in a handful of pixels from the one that was
# approved, and downloading risks a store page that is confidently wrong about
# which version of the app it is showing. If that ever stops being the right
# call, the seam to change is the `needs:` of `publish` and the artifact it
# reads — not this comment.
#
# Everything the pictures *are* comes out of `scripts/store-shots.sh`, run here
# exactly as it runs on a laptop, and the list of screens out of `src/shots.rs`
# — same as `play.yml`, which reproduces a laptop around `build-apk.sh` and
# decides nothing itself. What that script needs and a runner does not have is
# the frameworks: `Cargo.toml` names rinch and rhypedb by path as
# `../rinch-fixes` and `../rhypedb-main`, so they are cloned beside this repo
# at the commits `.github/siblings.env` pins, which is the same pattern and the
# same file `play.yml` uses.
#
# ## `workflow_dispatch` only, and never on a tag
#
# Deliberate, and it is the one thing about this file worth not changing
# casually. A tag means a release, and a release is `play.yml`'s job. Store
# screenshots change when the *app's screens* change, which is not on the same
# clock as a version bump — and a listing run that fired automatically on every
# tag would be a run nobody asked for, producing pictures nobody looked at,
# competing for the same emulator time as the build that actually ships. Now
# that this file can reach Play at all, the argument is stronger rather than
# weaker: a trigger nobody typed must never be a trigger that rewrites the store
# page, which is why `upload` is an input with a default and not a condition on
# the ref.
#
# Card S1 wrote down a rule for the day this file grew an upload — that a step
# wanting a credential belongs in a job of its own naming the environment, never
# bolted onto the capture — and that rule has been kept rather than bent.
# `secrets` appears exactly once below, in `publish`, which is a separate job,
# names the `play` environment and runs only on `upload: true`. `capture` and
# `compose` still hold no secret and name no environment, which is precisely
# what makes it safe for them to be the two that boot an emulator and run a
# rendering pipeline. Nothing here runs on `pull_request`, and nothing should,
# for the reason `play.yml` gives at greater length.
#
# ## Why the AVD is 1080x1920
#
# Because it is 16:9 exactly, and that is a ratio Google Play accepts for a
# phone screenshot without argument. The handset this project is developed
# against — a moto g stylus 5G — has a 1080x2400 panel, or 2.22:1, which Play
# rejects outright; so "plug the phone in and screenshot it" is not a pipeline
# that can exist, and the emulator is not standing in for a device here, it is
# the only thing with the right shape. The `pixel` profile below is 1080x1920,
# and `scripts/store-shots.sh` re-measures the panel before it captures
# anything and refuses to run on one that is not — a check that matters most
# here, where nobody is watching, and where a profile silently resolving to
# something else would otherwise produce a green run and a directory of
# unusable pictures.
#
# The emulator is headless (`-no-window`) and silent (`-noaudio`), on
# swiftshader rather than the host's GL. On a runner that is merely correct;
# the reason it is written down is that on a developer's machine it is
# `CLAUDE.md`'s first rule, and the two invocations should not drift.
name: Listing

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Send the finished listing to Play (off: build it and stop)"
        type: boolean
        default: false
      changes_not_sent_for_review:
        description: "Commit without submitting for review; needed while this is a draft app"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The emulator the pictures are taken on. Pinned, all three of them:
      # a system image is a rendering engine, a set of system fonts and a
      # status bar, and every one of those ends up in the frame.
      API_LEVEL: 34
      AVD_TARGET: default
      AVD_ARCH: x86_64
      AVD_PROFILE: pixel
    steps:
      - name: Check out SetListArray
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: setlistarray

      - name: Read the sibling pins
        run: grep -E '^[A-Z_]+=' setlistarray/.github/siblings.env >> "$GITHUB_ENV"

      - name: Check out rinch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RINCH_REPO }}
          ref: ${{ env.RINCH_REV }}
          path: rinch-fixes

      - name: Check out rhypedb
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RHYPEDB_REPO }}
          ref: ${{ env.RHYPEDB_REV }}
          path: rhypedb-main

      # Without this the emulator falls back to a software CPU and the run goes
      # from four minutes to "the timeout". The udev rule is the standard
      # recipe from the emulator action's own README.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rust, as rust-toolchain.toml asks
        working-directory: setlistarray
        run: rustup toolchain install

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: setlistarray
          # The siblings are path dependencies, so their source is in no hash
          # Cargo.lock contributes to the cache key. Their pins are.
          key: ${{ hashFiles('setlistarray/.github/siblings.env') }}

      - name: cargo-ndk
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-ndk@4.1.2

      - name: NDK r27c
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
          add-to-path: false

      - name: The SDK pieces build-apk.sh names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" "platforms;android-35" > /dev/null
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      # Built before the emulator step rather than inside it. `store-shots.sh`
      # will build for itself when handed no APK — that is the right default on
      # a laptop — but on a runner it would mean an emulator sitting idle
      # through a cold Rust build, and an emulator that boots and then waits
      # several minutes is an emulator with several minutes in which to go
      # wrong. `--target x86_64` matches AVD_ARCH above; the two have to agree
      # or the install fails with an ABI nobody mentions.
      - name: Build the shots APK
        working-directory: setlistarray
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          export ANDROID_SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_SDK_PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          export RINCH_DIR="$GITHUB_WORKSPACE/rinch-fixes"
          ./build-apk.sh --shots --target "$AVD_ARCH" --build-only < /dev/null
          test -f setlistarray.apk

      # The action boots the AVD and runs `script` against it;
      # `store-shots.sh` finds the device already attached and adopts it,
      # which is the branch in that script written for exactly this caller.
      # `-no-window` is passed anyway rather than relied upon: it is a promise
      # this repository makes in `CLAUDE.md` and it should be visible at every
      # place an emulator is started, not only in the one that happens to
      # default to it.
      - name: Capture the screens
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          avd-name: sla-shots
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          # One command, by absolute path, and the shape of this is load-bearing.
          #
          # This action runs **each line** of `script:` in its own `sh -c`. The
          # first version of this step was two lines — a `cd` into the checkout,
          # then the script by a relative path — and the log says exactly what
          # happened to it:
          #
          #     /usr/bin/sh -c cd "$GITHUB_WORKSPACE/setlistarray"
          #     /usr/bin/sh -c scripts/store-shots.sh --apk … --out …
          #     /usr/bin/sh: 1: scripts/store-shots.sh: not found
          #
          # Two shells. The `cd` happened in a process that then exited, and the
          # script ran from the workspace root where `scripts/` does not exist —
          # 127, a command not found, rather than anything about the emulator or
          # the APK. Worth recognising on sight, because every other multi-line
          # `run:` in this repository does carry state from line to line and this
          # one silently does not.
          #
          # `>-` folds the lines below into that single command. The `cd` is gone
          # rather than joined with `&&`, because `store-shots.sh` resolves its
          # own root from `BASH_SOURCE` and never cared what the working
          # directory was.
          script: >-
            "$GITHUB_WORKSPACE/setlistarray/scripts/store-shots.sh"
            --apk "$GITHUB_WORKSPACE/setlistarray/setlistarray.apk"
            --out "$GITHUB_WORKSPACE/setlistarray/.shots"

      # Raw frames, exactly as the panel drew them: no caption, no crop, no
      # device frame. That is what card S4 will take as its input, and it is
      # also what a person needs in order to say "that one is wrong" about a
      # screen rather than about a composite.
      #
      # `if-no-files-found: error` because the failure this guards against is
      # the quiet one: a capture step that somehow exits 0 having written
      # nothing would otherwise leave a green run with an empty artifact, and
      # the next person to look would be looking at the wrong half of the
      # pipeline.
      #
      # `insets.json` goes with them and is not a nicety. `store-frame.py` crops
      # the navigation bar off every frame by the rectangle that file measured on
      # the device, deliberately rather than by a constant it could get wrong the
      # first time the AVD is rebuilt with gesture navigation, and it refuses to
      # run at all when the file is absent. The first version of this step took
      # `setlistarray/.shots/*.png` and nothing else, which was harmless while
      # the compositing happened on somebody's laptop next to the captures and
      # stopped being harmless the moment `compose` below became the only reader:
      # seven frames arrived and the one number needed to use them did not.
      - name: Attach the frames to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listing-shots-${{ github.run_number }}
          path: |
            setlistarray/.shots/*.png
            setlistarray/.shots/insets.json
          if-no-files-found: error
          retention-days: 30

  # No emulator, no Android SDK, no Rust, no siblings, no secret: a Python
  # interpreter, two libraries and the repository's own artwork. Separate from
  # `capture` for a reason that is not speed — the compositing is the part that
  # actually gets iterated on, because a caption, a plate offset or a type scale
  # is a line in `store/shots.json` and somebody will want to see it rendered
  # three times in an afternoon. Re-running this job alone against a capture that
  # already exists is the cheapest loop this workflow has, and it costs nothing
  # to leave that door open.
  #
  # Checked out at the workspace root rather than into `setlistarray/` the way
  # `capture` does it. That layout exists so rinch and rhypedb can sit *beside*
  # the repo where `Cargo.toml`'s path dependencies expect them; nothing in this
  # job compiles Rust, so it would be a directory level added to every path here
  # in order to leave room for two things that are not coming.
  compose:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out SetListArray
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned like everything else, and for the ordinary reason plus one more:
      # this job draws type. Pillow renders the captions with its own bundled
      # FreeType, so the version of Pillow is part of what the pictures look
      # like, in the same way the AVD's system image is. A floating `pip install
      # pillow` would make the listing's typography depend on the day the job
      # ran, and the first symptom would be a re-render that nobody changed
      # differing from the one that was approved — which is exactly the doubt the
      # header above already admits this pipeline carries. No reason to add to
      # it for the sake of not typing a version number.
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Pillow and NumPy, which the compositor needs and nothing else here does
        run: python3 -m pip install --disable-pip-version-check pillow==12.1.1 numpy==2.3.5

      # Back into `.shots/`, the directory `store-shots.sh` would have written on
      # a laptop, so that the command below is the same command a person runs by
      # hand. A compositor invoked one way in CI and another way locally is a
      # compositor whose CI failures cannot be reproduced.
      - name: Fetch the frames the emulator took
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: listing-shots-${{ github.run_number }}
          path: .shots

      - name: Composite the listing
        run: python3 scripts/store-frame.py .shots store/metadata/en-US/images

      # The same assertions a second time, on purpose. `store-frame.py` runs them
      # itself at the end of every render — it says why in its own header, and
      # the short version is that a check somebody has to remember is a check
      # that is not run on the afternoon it matters — so this step is not adding
      # coverage. It is adding a *place*: the render step answers "did the
      # compositor produce pictures", this one answers "is the directory about to
      # be handed on acceptable to Play", and when the two disagree the
      # difference is between the rendering and what reached the disk. It is also
      # the exact command a person runs against a downloaded artifact, which is
      # worth having written down somewhere it is known to work.
      - name: Hold them to Play's limits
        run: python3 scripts/store-frame.py --check store/metadata/en-US/images

      # The finished listing, which git does not keep: `.gitignore` says why, and
      # the short of it is that these are a pure function of the app and the
      # words, and two megabytes of PNG in a diff is two megabytes nobody reads.
      # This artifact is the other half of that bargain — the pictures have to be
      # *somewhere* a person can open them, and on a default run this is the only
      # thing the whole workflow produces.
      - name: Attach the finished listing to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listing-images-${{ github.run_number }}
          path: store/metadata/en-US/images
          if-no-files-found: error
          retention-days: 30

  # The only job here that can change anything a stranger sees, and the only one
  # that runs on a condition rather than always.
  #
  # `concurrency: group: play` is the same group `play.yml` declares, and sharing
  # it across two workflows is the entire point. Play allows one open edit per
  # package: `edits.insert` fails while another edit is outstanding, and
  # `play.yml`'s upload action holds one open for as long as it takes to push an
  # eleven megabyte bundle. A listing run and a release run started within the
  # same few minutes would therefore have one of them fail — not with "somebody
  # else is uploading", but with an error about an edit, in whichever of the two
  # jobs happened to arrive second. Queueing is a great deal cheaper than the
  # afternoon spent working out that those two runs had anything to do with each
  # other. `cancel-in-progress: false` for the same reason it is false there: the
  # run in front is talking to Play, and killing it mid-edit is how an edit gets
  # left open.
  publish:
    needs: compose
    if: inputs.upload
    runs-on: ubuntu-24.04
    environment: play
    timeout-minutes: 15
    concurrency:
      group: play
      cancel-in-progress: false
    steps:
      - name: Check out SetListArray
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # `google-auth` and the rest arrive as its dependencies. Pinned for the
      # usual reason and not the typographic one above: nothing this job does is
      # visible in a picture, it just has to keep working.
      - name: The Play API client
        run: python3 -m pip install --disable-pip-version-check google-api-python-client==2.200.0

      # Into the directory `store-frame.py` writes and `play-listing.py` reads by
      # default, so the script needs no arguments and this workflow is not a
      # third place that knows the layout.
      - name: Fetch the pictures compose made
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: listing-images-${{ github.run_number }}
          path: store/metadata/en-US/images

      # Before the credential is anywhere near the process. `play-listing.py`
      # validates before it opens an edit whichever way it is run, so this step
      # buys no safety the next one does not already have; what it buys is a log.
      # When an upload fails, the question asked five minutes later is "what was
      # it trying to send", and the answer is a lot easier to find under a step
      # named for it than interleaved with the failure.
      - name: What this run would send
        run: python3 scripts/play-listing.py --dry-run

      # The one step in this file that writes to Google Play. Everything about
      # what it sends — the package, the three text fields, the deleteall before
      # each image type, the single edit the whole thing commits as — is in
      # `scripts/play-listing.py`'s header, which is where that argument belongs;
      # a workflow that explained the API it calls would be a workflow that goes
      # stale the first time the script is changed without it.
      - name: Send the listing to Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 scripts/play-listing.py \
            ${{ inputs.changes_not_sent_for_review && '--changes-not-sent-for-review' || '' }}
